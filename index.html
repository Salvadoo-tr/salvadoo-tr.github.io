<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALVA // CYBERPUNK TERMINAL</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== CYBERPUNK BACKGROUND EFFECTS ========== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(0deg, 
                    rgba(0, 255, 156, 0.03) 0px, 
                    rgba(0, 255, 156, 0.03) 2px,
                    transparent 2px,
                    transparent 4px
                );
            pointer-events: none;
            z-index: 0;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 255, 156, 0.03) 3px,
                rgba(0, 255, 156, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanMove 8s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        /* Glitch efekti için rastgele noktalar */
        .glitch-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        /* ========== TERMINAL CONTAINER ========== */
        .terminal-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #00ff9c;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 
                0 0 40px rgba(0, 255, 156, 0.1),
                inset 0 0 40px rgba(0, 255, 156, 0.05),
                0 0 80px rgba(0, 255, 156, 0.05);
            backdrop-filter: blur(10px);
        }

        /* ========== TERMINAL HEADER ========== */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 255, 156, 0.2);
            margin-bottom: 20px;
        }

        .terminal-title {
            color: #00ff9c;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 156, 0.3);
        }

        .terminal-title .blink {
            animation: blink 1.5s step-end infinite;
        }

        .terminal-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .dot-red { background: #ff0055; }
        .dot-yellow { background: #ffdd00; }
        .dot-green { background: #00ff9c; }

        .dot:hover {
            transform: scale(1.3);
            box-shadow: 0 0 15px currentColor;
        }

        /* ========== TERMINAL OUTPUT ========== */
        .terminal-output {
            color: #00ff9c;
            font-size: 15px;
            line-height: 1.8;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            position: relative;
        }

        .terminal-output .line {
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
            margin-bottom: 2px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .prompt {
            color: #00ff9c;
        }

        .prompt-symbol {
            color: #00ff9c;
            font-weight: bold;
        }

        .command {
            color: #ffffff;
        }

        .output-text {
            color: #b0ffd6;
            padding-left: 25px;
            display: block;
        }

        .highlight {
            color: #ffdd00;
        }

        .error {
            color: #ff0055;
        }

        .success {
            color: #00ff9c;
        }

        .info {
            color: #00bfff;
        }

        /* ASCII Art */
        .ascii-art {
            color: #00ff9c;
            font-size: 12px;
            line-height: 1.3;
            white-space: pre;
            margin: 10px 0;
            opacity: 0.7;
            text-shadow: 0 0 5px rgba(0, 255, 156, 0.1);
        }

        /* ========== SPOTIFY WIDGET ========== */
        .spotify-widget {
            background: rgba(0, 255, 156, 0.03);
            border: 1px solid rgba(0, 255, 156, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .spotify-widget:hover {
            border-color: #00ff9c;
            box-shadow: 0 0 30px rgba(0, 255, 156, 0.05);
        }

        .spotify-icon {
            font-size: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        .spotify-info {
            flex: 1;
        }

        .spotify-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }

        .spotify-artist {
            color: #00ff9c;
            font-size: 14px;
            opacity: 0.7;
        }

        .spotify-status {
            color: rgba(0, 255, 156, 0.5);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spotify-status .dot {
            width: 6px;
            height: 6px;
            background: #1DB954;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .spotify-progress {
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 156, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }

        .spotify-progress .fill {
            height: 100%;
            background: linear-gradient(90deg, #1DB954, #00ff9c);
            width: 0%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* ========== TERMINAL INPUT ========== */
        .terminal-input-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 156, 0.1);
        }

        .terminal-input-line .prompt {
            color: #00ff9c;
            margin-right: 10px;
            font-size: 16px;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #00ff9c;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
            flex: 1;
            caret-color: #00ff9c;
        }

        .terminal-input::placeholder {
            color: rgba(0, 255, 156, 0.3);
        }

        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff9c;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ========== COMMANDS ========== */
        .command-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 255, 156, 0.1);
        }

        .cmd-btn {
            background: rgba(0, 255, 156, 0.05);
            border: 1px solid rgba(0, 255, 156, 0.2);
            color: #00ff9c;
            padding: 6px 15px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cmd-btn:hover {
            background: rgba(0, 255, 156, 0.15);
            border-color: #00ff9c;
            box-shadow: 0 0 20px rgba(0, 255, 156, 0.1);
            transform: translateY(-2px);
        }

        .cmd-btn:active {
            transform: scale(0.95);
        }

        /* ========== STATUS BAR ========== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 255, 156, 0.1);
            font-size: 12px;
            color: rgba(0, 255, 156, 0.6);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #00ff9c;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .terminal-container {
                padding: 15px;
            }
            .terminal-output {
                font-size: 13px;
                line-height: 1.6;
                max-height: 350px;
            }
            .terminal-title {
                font-size: 11px;
            }
            .ascii-art {
                font-size: 8px;
            }
            .command-list {
                gap: 5px;
            }
            .cmd-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            .spotify-widget {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .terminal-output {
                font-size: 11px;
                line-height: 1.5;
                max-height: 300px;
            }
            .terminal-container {
                padding: 10px;
                border-radius: 8px;
            }
            .terminal-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ========== SCROLLBAR ========== */
        .terminal-output::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-output::-webkit-scrollbar-track {
            background: rgba(0, 255, 156, 0.05);
        }
        .terminal-output::-webkit-scrollbar-thumb {
            background: #00ff9c;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Cyberpunk Background Effects -->
    <div class="scanline"></div>
    <div class="glitch-dots" id="glitchDots"></div>

    <!-- ============================================================ -->
    <!-- TERMINAL -->
    <!-- ============================================================ -->
    <div class="terminal-container">
        
        <!-- Header -->
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="blink">●</span> SALVA@CYBERPUNK:~ 
                <span style="opacity:0.5; font-size:11px;">// v2.0</span>
            </div>
            <div class="terminal-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
        </div>

        <!-- Output Area -->
        <div class="terminal-output" id="output">
            <!-- İçerik JS ile doldurulacak -->
        </div>

        <!-- Spotify Widget -->
        <div class="spotify-widget" id="spotifyWidget">
            <div class="spotify-icon">🎵</div>
            <div class="spotify-info">
                <div class="spotify-title" id="spotifyTitle">Şu an çalmıyor</div>
                <div class="spotify-artist" id="spotifyArtist">Spotify'a bağlan...</div>
                <div class="spotify-progress">
                    <div class="fill" id="spotifyProgress" style="width: 0%;"></div>
                </div>
            </div>
            <div class="spotify-status">
                <span class="dot"></span>
                <span id="spotifyStatus">DURAKLATILDI</span>
            </div>
        </div>

        <!-- Input Line -->
        <div class="terminal-input-line">
            <span class="prompt">$</span>
            <input type="text" class="terminal-input" id="commandInput" placeholder="Komut girin..." autofocus>
            <span class="cursor-blink"></span>
        </div>

        <!-- Quick Commands -->
        <div class="command-list">
            <button class="cmd-btn" data-cmd="whoami">> whoami</button>
            <button class="cmd-btn" data-cmd="about">> ./about-me.sh</button>
            <button class="cmd-btn" data-cmd="neofetch">> neofetch</button>
            <button class="cmd-btn" data-cmd="projects">> ls ./projects</button>
            <button class="cmd-btn" data-cmd="status">> git status</button>
            <button class="cmd-btn" data-cmd="spotify">> spotify</button>
            <button class="cmd-btn" data-cmd="clear">> clear</button>
            <button class="cmd-btn" data-cmd="help">> help</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="status-item">
                <span class="status-dot online"></span>
                SYSTEM: ONLINE
            </span>
            <span class="status-item">
                <span class="status-dot online"></span>
                CONNECTION: SECURE
            </span>
            <span class="status-item">
                <span class="status-dot online"></span>
                MODE: BUILDING
            </span>
            <span class="status-item" id="timeDisplay">
                ⏱️ 00:00:00
            </span>
        </div>
    </div>

    <script>
        // ============================================================
        // SPOTIFY API CONFIG (KENDİ BİLGİLERİNİ GİR)
        // ============================================================
        const SPOTIFY_CONFIG = {
            clientId: 'SENIN_CLIENT_ID',      // Spotify Developer'dan al
            clientSecret: 'SENIN_CLIENT_SECRET', // Spotify Developer'dan al
            refreshToken: 'SENIN_REFRESH_TOKEN'   // Spotify API'den al
        };

        // ============================================================
        // DATA
        // ============================================================
        const asciiArt = `
        ███████╗ █████╗ ██╗     ██╗   ██╗ █████╗ 
        ██╔════╝██╔══██╗██║     ██║   ██║██╔══██╗
        ███████╗███████║██║     ██║   ██║███████║
        ╚════██║██╔══██║██║     ██║   ██║██╔══██║
        ███████║██║  ██║███████╗╚██████╔╝██║  ██║
        ╚══════╝╚═╝  ╚═╝╚══════╝ ╚═════╝ ╚═╝  ╚═╝
        `;

        // ============================================================
        // SPOTIFY FUNCTIONS
        // ============================================================
        let spotifyToken = null;
        let spotifyData = null;
        let spotifyInterval = null;

        async function getSpotifyToken() {
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(SPOTIFY_CONFIG.clientId + ':' + SPOTIFY_CONFIG.clientSecret)
                    },
                    body: 'grant_type=refresh_token&refresh_token=' + SPOTIFY_CONFIG.refreshToken
                });
                
                const data = await response.json();
                spotifyToken = data.access_token;
                return spotifyToken;
            } catch (error) {
                console.error('Spotify token hatası:', error);
                return null;
            }
        }

        async function getSpotifyNowPlaying() {
            if (!spotifyToken) {
                await getSpotifyToken();
                if (!spotifyToken) return null;
            }

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: {
                        'Authorization': 'Bearer ' + spotifyToken
                    }
                });

                if (response.status === 204) {
                    // Hiçbir şey çalmıyor
                    return null;
                }

                if (response.status === 401) {
                    // Token expired, yenile
                    await getSpotifyToken();
                    return getSpotifyNowPlaying();
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Spotify veri çekme hatası:', error);
                return null;
            }
        }

        async function updateSpotifyWidget() {
            const data = await getSpotifyNowPlaying();
            
            const titleEl = document.getElementById('spotifyTitle');
            const artistEl = document.getElementById('spotifyArtist');
            const statusEl = document.getElementById('spotifyStatus');
            const progressEl = document.getElementById('spotifyProgress');
            const iconEl = document.querySelector('.spotify-icon');

            if (data && data.item) {
                const track = data.item;
                const progress = data.progress_ms;
                const duration = track.duration_ms;
                const percent = (progress / duration) * 100;

                titleEl.textContent = track.name;
                artistEl.textContent = track.artists.map(a => a.name).join(', ');
                statusEl.textContent = data.is_playing ? '▶ ÇALIYOR' : '⏸ DURAKLATILDI';
                progressEl.style.width = Math.min(percent, 100) + '%';
                iconEl.textContent = '🎵';

                // Widget'ı göster
                document.getElementById('spotifyWidget').style.display = 'flex';
                document.getElementById('spotifyWidget').style.borderColor = data.is_playing ? '#1DB954' : 'rgba(0,255,156,0.15)';
            } else {
                titleEl.textContent = 'Şu an çalmıyor';
                artistEl.textContent = 'Spotify\'da bir şey çalmıyor';
                statusEl.textContent = '⏸ DURAKLATILDI';
                progressEl.style.width = '0%';
                iconEl.textContent = '⏸';
                document.getElementById('spotifyWidget').style.borderColor = 'rgba(0,255,156,0.15)';
            }
        }

        function startSpotifyUpdates() {
            if (spotifyInterval) clearInterval(spotifyInterval);
            
            // İlk güncelleme
            updateSpotifyWidget();
            
            // Her 5 saniyede bir güncelle
            spotifyInterval = setInterval(updateSpotifyWidget, 5000);
        }

        // ============================================================
        // COMMAND HANDLER
        // ============================================================
        const output = document.getElementById('output');
        const input = document.getElementById('commandInput');
        let commandHistory = [];
        let historyIndex = -1;

        function typeLine(text, className = '', delay = 50) {
            return new Promise(resolve => {
                const line = document.createElement('div');
                line.className = 'line';
                if (className) line.className += ' ' + className;
                
                // Eğer ascii art ise direkt yaz
                if (text.includes('█████')) {
                    line.textContent = text;
                    line.style.whiteSpace = 'pre';
                    output.appendChild(line);
                    resolve();
                    return;
                }

                // Tek tek yazma efekti
                let i = 0;
                const type = () => {
                    if (i < text.length) {
                        line.textContent += text[i];
                        i++;
                        setTimeout(type, delay);
                    } else {
                        resolve();
                    }
                };
                output.appendChild(line);
                type();
            });
        }

        async function executeCommand(cmd) {
            const trimmed = cmd.trim().toLowerCase();
            
            // Boş komut
            if (!trimmed) {
                await typeLine('');
                return;
            }

            // Komut geçmişine ekle
            if (trimmed !== 'clear' && trimmed !== 'cls') {
                commandHistory.push(trimmed);
                historyIndex = commandHistory.length;
            }

            // Komut başlığını yaz
            await typeLine(`$ ${cmd}`, 'prompt');

            // Komut işleme
            switch(trimmed) {
                case 'whoami':
                    await typeLine('USER        :: SALVA', 'output-text');
                    await typeLine('STATUS      :: ● ONLINE', 'output-text');
                    await typeLine('MODE        :: BUILDING', 'output-text');
                    await typeLine('ENVIRONMENT :: CYBERPUNK', 'output-text');
                    await typeLine('');
                    await typeLine('> Software developer & cyberpunk enthusiast.', 'output-text');
                    await typeLine('> Building the future, one line of code at a time.', 'output-text');
                    await typeLine('> Currently: Breaking things to understand them.', 'output-text');
                    break;

                case 'about':
                case './about-me.sh':
                    await typeLine('[+] Initializing user profile...', 'info');
                    await typeLine('');
                    await typeLine('USER        :: SALVA', 'output-text');
                    await typeLine('STATUS      :: ● ONLINE', 'output-text');
                    await typeLine('MODE        :: BUILDING', 'output-text');
                    await typeLine('MISSION     :: CREATE / LEARN / BREAK / REBUILD', 'output-text');
                    await typeLine('');
                    await typeLine('[✓] Curiosity ............ 100%', 'success');
                    await typeLine('[✓] Coffee ............... 99%', 'success');
                    await typeLine('[✓] Bugs ................. definitely present', 'success');
                    await typeLine('[✓] Sleep ................ optional', 'success');
                    await typeLine('');
                    await typeLine('[+] Profile initialized.', 'success');
                    break;

                case 'neofetch':
                    await typeLine(asciiArt, 'ascii-art');
                    await typeLine('        OS       :: CyberOS v2.0', 'output-text');
                    await typeLine('        Shell    :: zsh', 'output-text');
                    await typeLine('        Editor   :: VS Code', 'output-text');
                    await typeLine('        Mode     :: Dark / Cyberpunk', 'output-text');
                    await typeLine('        Status   :: ● Online', 'output-text');
                    await typeLine('        Focus    :: Build stuff', 'output-text');
                    await typeLine('');
                    await typeLine('        curiosity.exe :: RUNNING', 'output-text');
                    await typeLine('        coffee.exe    :: RUNNING', 'output-text');
                    await typeLine('        sleep.exe     :: NOT FOUND', 'error');
                    break;

                case 'projects':
                case 'ls ./projects':
                    await typeLine('projects/');
                    await typeLine('');
                    await typeLine('├── cyber-terminal/');
                    await typeLine('├── ai-assistant/');
                    await typeLine('├── dark-web-tools/');
                    await typeLine('└── future_ideas/');
                    await typeLine('');
                    await typeLine('> 3 projects active. 1 classified.', 'info');
                    break;

                case 'git status':
                    await typeLine('On branch main');
                    await typeLine('');
                    await typeLine('Changes not staged for commit:', 'output-text');
                    await typeLine('');
                    await typeLine('  modified:   ideas', 'output-text');
                    await typeLine('  modified:   skills', 'output-text');
                    await typeLine('  modified:   future_projects', 'output-text');
                    await typeLine('');
                    await typeLine('Untracked files:', 'output-text');
                    await typeLine('');
                    await typeLine('  something-cool/', 'output-text');
                    await typeLine('');
                    await typeLine('nothing is ever really finished.', 'info');
                    break;

                case 'spotify':
                    await typeLine('[✓] Spotify bağlantısı kontrol ediliyor...', 'info');
                    await typeLine('');
                    
                    const spotifyData = await getSpotifyNowPlaying();
                    if (spotifyData && spotifyData.item) {
                        const track = spotifyData.item;
                        await typeLine(`🎵 Şu an çalan: ${track.name}`, 'highlight');
                        await typeLine(`🎤 Sanatçı: ${track.artists.map(a => a.name).join(', ')}`, 'output-text');
                        await typeLine(`⏱️ Süre: ${Math.floor(track.duration_ms / 60000)}:${Math.floor((track.duration_ms % 60000) / 1000).toString().padStart(2, '0')}`, 'output-text');
                        await typeLine(`▶ Durum: ${spotifyData.is_playing ? 'ÇALIYOR' : 'DURAKLATILDI'}`, 'success');
                        await typeLine(`🔗 Link: ${track.external_urls.spotify}`, 'info');
                    } else {
                        await typeLine('⏸ Şu an hiçbir şey çalmıyor.', 'error');
                        await typeLine('> Spotify\'da bir şey aç ve tekrar dene.', 'info');
                    }
                    break;

                case 'clear':
                case 'cls':
                    output.innerHTML = '';
                    break;

                case 'help':
                    await typeLine('📡 KOMUTLAR:', 'highlight');
                    await typeLine('');
                    await typeLine('  whoami          - Kullanıcı bilgileri', 'output-text');
                    await typeLine('  about           - Profil detayları', 'output-text');
                    await typeLine('  neofetch        - Sistem bilgileri', 'output-text');
                    await typeLine('  projects        - Projeleri listele', 'output-text');
                    await typeLine('  git status      - Git durumu', 'output-text');
                    await typeLine('  spotify         - Şu an çalan şarkı', 'output-text');
                    await typeLine('  clear           - Ekranı temizle', 'output-text');
                    await typeLine('  help            - Bu mesajı göster', 'output-text');
                    await typeLine('  exit            - Oturumu kapat', 'output-text');
                    break;

                case 'exit':
                    await typeLine('🔒 Oturum kapatılıyor...', 'error');
                    await typeLine('> Bağlantı sonlandırıldı.', 'error');
                    await typeLine('> Sistem beklemeye alındı.', 'error');
                    break;

                default:
                    await typeLine(`Komut bulunamadı: ${cmd}`, 'error');
                    await typeLine(`'help' yazarak komut listesini görebilirsin.`, 'info');
            }

            // Sonra bir boşluk
            await typeLine('');
            
            // Scroll to bottom
            output.scrollTop = output.scrollHeight;
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================
        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.value = '';
                await executeCommand(cmd);
                output.scrollTop = output.scrollHeight;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (commandHistory.length > 0) {
                    historyIndex = Math.max(0, historyIndex - 1);
                    input.value = commandHistory[historyIndex] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex] || '';
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            }
        });

        // Button click
        document.querySelectorAll('.cmd-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const cmd = btn.dataset.cmd;
                input.value = cmd;
                await executeCommand(cmd);
                output.scrollTop = output.scrollHeight;
            });
        });

        // Click anywhere to focus input
        document.addEventListener('click', () => {
            input.focus();
        });

        // ============================================================
        // GLITCH DOTS EFFECT
        // ============================================================
        function createGlitchDots() {
            const container = document.getElementById('glitchDots');
            for (let i = 0; i < 20; i++) {
                const dot = document.createElement('div');
                dot.style.cssText = `
                    position: fixed;
                    width: ${Math.random() * 3 + 1}px;
                    height: ${Math.random() * 3 + 1}px;
                    background: #00ff9c;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    opacity: ${Math.random() * 0.2};
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 0;
                `;
                container.appendChild(dot);
            }
        }
        createGlitchDots();

        // ============================================================
        // CLOCK
        // ============================================================
        function updateClock() {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('timeDisplay').textContent = `⏱️ ${time}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ============================================================
        // AUTO-START
        // ============================================================
        window.addEventListener('load', async () => {
            await typeLine('> Bağlantı kuruluyor...', 'info', 100);
            await typeLine('> SALVA@CYBERPUNK terminal başlatılıyor...', 'info', 100);
            await typeLine('> Spotify entegrasyonu aktif...', 'info', 100);
            await typeLine('');
            await typeLine('> Oturum açıldı. "help" yazarak başlayın.', 'highlight');
            await typeLine('> "spotify" ile şu an çalan şarkıyı görebilirsin.', 'info');
            await typeLine('');
            
            // Spotify widget'ı başlat
            startSpotifyUpdates();
            
            output.scrollTop = output.scrollHeight;
        });
    </script>

</body>
</html>
