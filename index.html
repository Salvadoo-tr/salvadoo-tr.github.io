<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALVA // RED CYBERPUNK</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ========== KIRMIZI MATRIX ARKAPLAN ========== */
        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ========== SCANLINE ========== */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(255, 0, 0, 0.03) 3px,
                rgba(255, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanMove 8s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        /* ========== TERMINAL CONTAINER ========== */
        .terminal-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid #ff0033;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 
                0 0 60px rgba(255, 0, 51, 0.15),
                inset 0 0 60px rgba(255, 0, 51, 0.05),
                0 0 120px rgba(255, 0, 51, 0.05);
            backdrop-filter: blur(10px);
        }

        /* ========== HEADER ========== */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 0, 51, 0.2);
            margin-bottom: 20px;
        }

        .terminal-title {
            color: #ff0033;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .terminal-title .blink {
            animation: blink 1.5s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .terminal-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .dot-red { background: #ff0033; box-shadow: 0 0 15px #ff0033; }
        .dot-yellow { background: #ff6600; box-shadow: 0 0 15px #ff6600; }
        .dot-green { background: #00ff9c; box-shadow: 0 0 15px #00ff9c; }

        .dot:hover {
            transform: scale(1.3);
        }

        /* ========== OUTPUT ========== */
        .terminal-output {
            color: #ff0033;
            font-size: 15px;
            line-height: 1.8;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            position: relative;
        }

        .terminal-output .line {
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
            margin-bottom: 2px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .output-text {
            color: #ff6688;
            padding-left: 25px;
            display: block;
        }

        .highlight {
            color: #ffcc00;
        }

        .error {
            color: #ff0033;
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        .success {
            color: #ff0033;
        }

        .info {
            color: #ff8844;
        }

        .ascii-art {
            color: #ff0033;
            font-size: 12px;
            line-height: 1.3;
            white-space: pre;
            margin: 10px 0;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(255, 0, 51, 0.1);
        }

        /* ========== INPUT ========== */
        .terminal-input-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 0, 51, 0.1);
        }

        .terminal-input-line .prompt {
            color: #ff0033;
            margin-right: 10px;
            font-size: 16px;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #ff0033;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
            flex: 1;
            caret-color: #ff0033;
        }

        .terminal-input::placeholder {
            color: rgba(255, 0, 51, 0.3);
        }

        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #ff0033;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }

        /* ========== COMMANDS ========== */
        .command-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 0, 51, 0.1);
        }

        .cmd-btn {
            background: rgba(255, 0, 51, 0.05);
            border: 1px solid rgba(255, 0, 51, 0.2);
            color: #ff0033;
            padding: 6px 15px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cmd-btn:hover {
            background: rgba(255, 0, 51, 0.15);
            border-color: #ff0033;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.1);
            transform: translateY(-2px);
        }

        .cmd-btn:active {
            transform: scale(0.95);
        }

        /* ========== STATUS ========== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 0, 51, 0.1);
            font-size: 12px;
            color: rgba(255, 0, 51, 0.6);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #ff0033;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .terminal-container { padding: 15px; }
            .terminal-output { font-size: 13px; line-height: 1.6; max-height: 350px; }
            .terminal-title { font-size: 11px; }
            .ascii-art { font-size: 8px; }
            .command-list { gap: 5px; }
            .cmd-btn { font-size: 10px; padding: 4px 10px; }
        }

        @media (max-width: 480px) {
            .terminal-output { font-size: 11px; line-height: 1.5; max-height: 300px; }
            .terminal-container { padding: 10px; border-radius: 8px; }
            .terminal-header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }

        .terminal-output::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-output::-webkit-scrollbar-track {
            background: rgba(255, 0, 51, 0.05);
        }
        .terminal-output::-webkit-scrollbar-thumb {
            background: #ff0033;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- ========== ARKAPLAN CANVAS (BAĞLANAN ÇİZGİLER) ========== -->
    <canvas id="networkCanvas"></canvas>
    
    <div class="scanline"></div>

    <!-- ========== TERMINAL ========== -->
    <div class="terminal-container">
        
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="blink">●</span> SALVA@RED_CYBER:~ 
                <span style="opacity:0.5; font-size:11px;">// v3.0</span>
            </div>
            <div class="terminal-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
        </div>

        <div class="terminal-output" id="output"></div>

        <div class="terminal-input-line">
            <span class="prompt">$</span>
            <input type="text" class="terminal-input" id="commandInput" placeholder="Komut girin..." autofocus>
            <span class="cursor-blink"></span>
        </div>

        <div class="command-list">
            <button class="cmd-btn" data-cmd="whoami">> whoami</button>
            <button class="cmd-btn" data-cmd="about">> ./about-me.sh</button>
            <button class="cmd-btn" data-cmd="neofetch">> neofetch</button>
            <button class="cmd-btn" data-cmd="projects">> ls ./projects</button>
            <button class="cmd-btn" data-cmd="status">> git status</button>
            <button class="cmd-btn" data-cmd="clear">> clear</button>
            <button class="cmd-btn" data-cmd="help">> help</button>
        </div>

        <div class="status-bar">
            <span class="status-item">
                <span class="status-dot online"></span>
                SYSTEM: ONLINE
            </span>
            <span class="status-item">
                <span class="status-dot online"></span>
                CONNECTION: SECURE
            </span>
            <span class="status-item">
                <span class="status-dot online"></span>
                MODE: BUILDING
            </span>
            <span class="status-item" id="timeDisplay">
                ⏱️ 00:00:00
            </span>
        </div>
    </div>

    <script>
        // ============================================================
        // ARKAPLAN: BAĞLANAN ÇİZGİLER (MATRIX TARZI)
        // ============================================================
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 80;
        const CONNECTION_DISTANCE = 150;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Kenarlardan sekme
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0033';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 10;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < CONNECTION_DISTANCE) {
                        const opacity = 1 - (distance / CONNECTION_DISTANCE);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 0, 51, ${opacity * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.shadowColor = `rgba(255, 0, 51, ${opacity * 0.2})`;
                        ctx.shadowBlur = 10;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Çizgileri önce çiz (arkada kalsın)
            drawLines();

            // Sonra parçacıkları çiz
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        // Başlat
        resize();
        initParticles();
        animate();

        // ============================================================
        // TERMINAL KOMUTLARI
        // ============================================================
        const asciiArt = `
        ███████╗ █████╗ ██╗     ██╗   ██╗ █████╗ 
        ██╔════╝██╔══██╗██║     ██║   ██║██╔══██╗
        ███████╗███████║██║     ██║   ██║███████║
        ╚════██║██╔══██║██║     ██║   ██║██╔══██║
        ███████║██║  ██║███████╗╚██████╔╝██║  ██║
        ╚══════╝╚═╝  ╚═╝╚══════╝ ╚═════╝ ╚═╝  ╚═╝
        `;

        const output = document.getElementById('output');
        const input = document.getElementById('commandInput');
        let commandHistory = [];
        let historyIndex = -1;

        function typeLine(text, className = '', delay = 50) {
            return new Promise(resolve => {
                const line = document.createElement('div');
                line.className = 'line';
                if (className) line.className += ' ' + className;
                
                if (text.includes('█████')) {
                    line.textContent = text;
                    line.style.whiteSpace = 'pre';
                    output.appendChild(line);
                    resolve();
                    return;
                }

                let i = 0;
                const type = () => {
                    if (i < text.length) {
                        line.textContent += text[i];
                        i++;
                        setTimeout(type, delay);
                    } else {
                        resolve();
                    }
                };
                output.appendChild(line);
                type();
            });
        }

        async function executeCommand(cmd) {
            const trimmed = cmd.trim().toLowerCase();
            
            if (!trimmed) {
                await typeLine('');
                return;
            }

            if (trimmed !== 'clear' && trimmed !== 'cls') {
                commandHistory.push(trimmed);
                historyIndex = commandHistory.length;
            }

            await typeLine(`$ ${cmd}`, 'prompt');

            switch(trimmed) {
                case 'whoami':
                    await typeLine('USER        :: SALVA', 'output-text');
                    await typeLine('STATUS      :: ● ONLINE', 'output-text');
                    await typeLine('MODE        :: BUILDING', 'output-text');
                    await typeLine('ENVIRONMENT :: RED_CYBER', 'output-text');
                    await typeLine('');
                    await typeLine('> Software developer & cyberpunk enthusiast.', 'output-text');
                    await typeLine('> Building the future, one line of code at a time.', 'output-text');
                    await typeLine('> Currently: Breaking things to understand them.', 'output-text');
                    break;

                case 'about':
                case './about-me.sh':
                    await typeLine('[+] Initializing user profile...', 'info');
                    await typeLine('');
                    await typeLine('USER        :: SALVA', 'output-text');
                    await typeLine('STATUS      :: ● ONLINE', 'output-text');
                    await typeLine('MODE        :: BUILDING', 'output-text');
                    await typeLine('MISSION     :: CREATE / LEARN / BREAK / REBUILD', 'output-text');
                    await typeLine('');
                    await typeLine('[✓] Curiosity ............ 100%', 'success');
                    await typeLine('[✓] Coffee ............... 99%', 'success');
                    await typeLine('[✓] Bugs ................. definitely present', 'success');
                    await typeLine('[✓] Sleep ................ optional', 'success');
                    await typeLine('');
                    await typeLine('[+] Profile initialized.', 'success');
                    break;

                case 'neofetch':
                    await typeLine(asciiArt, 'ascii-art');
                    await typeLine('        OS       :: RedCyber v3.0', 'output-text');
                    await typeLine('        Shell    :: zsh', 'output-text');
                    await typeLine('        Editor   :: VS Code', 'output-text');
                    await typeLine('        Mode     :: Dark / Red', 'output-text');
                    await typeLine('        Status   :: ● Online', 'output-text');
                    await typeLine('        Focus    :: Build stuff', 'output-text');
                    await typeLine('');
                    await typeLine('        curiosity.exe :: RUNNING', 'output-text');
                    await typeLine('        coffee.exe    :: RUNNING', 'output-text');
                    await typeLine('        sleep.exe     :: NOT FOUND', 'error');
                    break;

                case 'projects':
                case 'ls ./projects':
                    await typeLine('projects/');
                    await typeLine('');
                    await typeLine('├── red-terminal/');
                    await typeLine('├── ai-assistant/');
                    await typeLine('├── dark-web-tools/');
                    await typeLine('└── future_ideas/');
                    await typeLine('');
                    await typeLine('> 3 projects active. 1 classified.', 'info');
                    break;

                case 'git status':
                    await typeLine('On branch main');
                    await typeLine('');
                    await typeLine('Changes not staged for commit:', 'output-text');
                    await typeLine('');
                    await typeLine('  modified:   ideas', 'output-text');
                    await typeLine('  modified:   skills', 'output-text');
                    await typeLine('  modified:   future_projects', 'output-text');
                    await typeLine('');
                    await typeLine('Untracked files:', 'output-text');
                    await typeLine('');
                    await typeLine('  something-cool/', 'output-text');
                    await typeLine('');
                    await typeLine('nothing is ever really finished.', 'info');
                    break;

                case 'clear':
                case 'cls':
                    output.innerHTML = '';
                    break;

                case 'help':
                    await typeLine('📡 KOMUTLAR:', 'highlight');
                    await typeLine('');
                    await typeLine('  whoami          - Kullanıcı bilgileri', 'output-text');
                    await typeLine('  about           - Profil detayları', 'output-text');
                    await typeLine('  neofetch        - Sistem bilgileri', 'output-text');
                    await typeLine('  projects        - Projeleri listele', 'output-text');
                    await typeLine('  git status      - Git durumu', 'output-text');
                    await typeLine('  clear           - Ekranı temizle', 'output-text');
                    await typeLine('  help            - Bu mesajı göster', 'output-text');
                    await typeLine('  exit            - Oturumu kapat', 'output-text');
                    break;

                case 'exit':
                    await typeLine('🔒 Oturum kapatılıyor...', 'error');
                    await typeLine('> Bağlantı sonlandırıldı.', 'error');
                    await typeLine('> Sistem beklemeye alındı.', 'error');
                    break;

                default:
                    await typeLine(`Komut bulunamadı: ${cmd}`, 'error');
                    await typeLine(`'help' yazarak komut listesini görebilirsin.`, 'info');
            }

            await typeLine('');
            output.scrollTop = output.scrollHeight;
        }

        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.value = '';
                await executeCommand(cmd);
                output.scrollTop = output.scrollHeight;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (commandHistory.length > 0) {
                    historyIndex = Math.max(0, historyIndex - 1);
                    input.value = commandHistory[historyIndex] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex] || '';
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            }
        });

        document.querySelectorAll('.cmd-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const cmd = btn.dataset.cmd;
                input.value = cmd;
                await executeCommand(cmd);
                output.scrollTop = output.scrollHeight;
            });
        });

        document.addEventListener('click', () => {
            input.focus();
        });

        function updateClock() {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('timeDisplay').textContent = `⏱️ ${time}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        window.addEventListener('load', async () => {
            await typeLine('> Bağlantı kuruluyor...', 'info', 100);
            await typeLine('> SALVA@RED_CYBER terminal başlatılıyor...', 'info', 100);
            await typeLine('');
            await typeLine('> Oturum açıldı. "help" yazarak başlayın.', 'highlight');
            await typeLine('');
            output.scrollTop = output.scrollHeight;
        });
    </script>

</body>
</html>
